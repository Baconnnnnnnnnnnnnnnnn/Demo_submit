<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>Danh sach nhom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f6f8fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar-logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            border-left: 4px solid white;
            padding-left: 11px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-text .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .user-text .user-role {
            font-size: 12px;
            color: #999;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-left: 15px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .content-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .hint {
            color: #666;
            font-size: 13px;
        }

        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .group-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .group-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .group-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .group-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .group-info strong {
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fadbd8;
            color: #c0392b;
            border: 1px solid #e74c3c;
        }

        .alert-success {
            background: #d4efdf;
            color: #186a3b;
            border: 1px solid #27ae60;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-logo" th:text="${className} ?: 'PMS'">PMS</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/student/group/list" class="nav-link active">
                    <span>Nhom</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-left">Danh sach nhom</div>
            <div style="display: flex; align-items: center;">
                <div class="user-info">
                    <div class="user-avatar">
                        <img src="/img/user.png" alt="Avatar" />
                    </div>
                    <div class="user-text">
                        <div class="user-name" th:text="${studentName} ?: 'Hoc sinh'">Hoc sinh</div>
                        <div class="user-role" th:text="${userRole} ?: 'Hoc sinh'">Hoc sinh</div>
                    </div>
                </div>
                <form action="/acc/logout" method="get">
                    <button type="submit" class="logout-btn">Dang xuat</button>
                </form>
            </div>
        </div>

        <div class="content">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div class="content-header">
                <div class="content-title">Nhom cua ban</div>
                <div th:if="${canCreateGroup}">
                    <a href="/student/group/create" class="btn-primary">+ Tao nhom moi</a>
                </div>
                <div th:unless="${canCreateGroup}" class="hint">
                    Ban dang o trong 1 nhom, khong the tao nhom moi.
                </div>
            </div>

            <div th:if="${groups != null && groups.size() > 0}" class="groups-container">
                <div th:each="group : ${groups}" class="group-card">
                    <a th:href="@{/student/group/{id}(id=${group.groupId})}">
                        <div class="group-name" th:text="${group.groupName}">Ten nhom</div>
                        <div class="group-info">
                            <strong>ID:</strong> <span th:text="${group.groupId}">1</span>
                        </div>
                        <div class="group-info">
                            <strong>Vai tro:</strong>
                            <span th:if="${group.leaderId == studentId}" style="color: #27ae60; font-weight: 600;">Nhom truong</span>
                            <span th:unless="${group.leaderId == studentId}" style="color: #3498db; font-weight: 600;">Thanh vien</span>
                        </div>
                        <div class="group-info">
                            <strong>Ngay tao:</strong>
                            <span th:text="${#temporals.format(group.createdDate, 'dd/MM/yyyy HH:mm')}">01/01/2026 00:00</span>
                        </div>
                    </a>
                </div>
            </div>

            <div th:if="${groups == null || groups.size() == 0}" class="empty-state">
                <div class="empty-state-icon">N/A</div>
                <div class="empty-state-text">Ban chua co nhom nao</div>
                <a th:if="${canCreateGroup}" href="/student/group/create" class="btn-primary">Tao nhom dau tien</a>
            </div>
        </div>
    </div>
</body>

</html>
